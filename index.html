<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برا السالفة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="app">
        <!-- شاشة الترحيب -->
        <section id="welcome" class="screen">
            <h1>برا السالفة</h1>
            <button id="startBtn">ابدأ اللعب</button>
            <button id="packsBtn">الباقات</button>
            <button id="settingsBtn">الإعدادات</button>
        </section>

        <!-- شاشة إضافة اللاعبين -->
        <section id="playerSetup" class="screen" hidden>
            <h2>إضافة اللاعبين</h2>
            <div class="player-input">
                <input type="text" id="playerName" placeholder="أدخل اسم اللاعب">
                <button id="addPlayerBtn">أضف لاعب</button>
            </div>
            <ul id="playersList"></ul>
            <p id="playerWarning" class="warning" hidden>من فضلك ادخل 3 لاعبين على الأقل</p>
            <button id="nextToPack" disabled>التالي</button>
        </section>

        <!-- شاشة اختيار الباقة -->
        <section id="packScreen" class="screen" hidden>
            <h2>اختر الباقة</h2>
            <div id="packsContainer"></div>
            <button id="startRoundBtn" disabled>ابدأ الجولة</button>
        </section>

        <!-- شاشة توزيع الأدوار -->
        <section id="roleScreen" class="screen" hidden>
            <h2>توزيع الأدوار</h2>
            <p id="roleInfo">مرر الجهاز لكل لاعب واضغط "أرني دوري"</p>
            <button id="showRoleBtn">أرني دوري</button>
            <div id="roleCard" class="role-card" hidden>
                <p id="roleText"></p>
                <button id="hideRoleBtn">تم</button>
            </div>
        </section>

        <!-- شاشة النقاش -->
        <section id="discussionScreen" class="screen" hidden>
            <h2>النقاش</h2>
            <div id="timer">03:00</div>
            <button id="toVotingBtn">انتقل للتصويت</button>
        </section>

        <!-- شاشة التصويت -->
        <section id="votingScreen" class="screen" hidden>
            <h2>التصويت</h2>
            <div id="votingPlayers"></div>
            <button id="finishVotingBtn" disabled>اعرض النتائج</button>
        </section>

        <!-- شاشة النتائج -->
        <section id="resultsScreen" class="screen" hidden>
            <h2>النتائج</h2>
            <p id="winnerText"></p>
            <button id="newRoundBtn">جولة جديدة</button>
            <button id="backHomeBtn">العودة للرئيسية</button>
        </section>
    </main>

    <script src="gameLogic.js"></script>
    <script src="app.js"></script>
</body>
</html>
